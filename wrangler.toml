# Cloudflare Pages project "vitrans" (https://vitrans.pages.dev): the page (web/) and the translation API as Pages
# Functions (functions/, spec Amendment F). The deploy folder that tools/build_site.py writes has the same layout
# (web/ + functions/ + this file); the pack bundle comes from tools/bundle_packs.py. README: "Translation API".
# This file is the project's configuration (source of truth) once a deploy carries it.
# Secrets are not here: TURNSTILE_SECRET and SESSION_SECRET are set per environment with
#   npx wrangler pages secret put <NAME> --project-name vitrans [--env preview]
# (ALLOW_TEST_TURNSTILE=1 only for the preview environment and local dev, never for production).
name = "vitrans"
pages_build_output_dir = "web"
compatibility_date = "2026-10-01"
compatibility_flags = ["enable_request_signal"]

[ai]
binding = "AI"

# Counters only (segments per session / IP hash, neurons per day), never content.
[[kv_namespaces]]
binding = "COUNTERS"
id = "a892e524d522492da35d0cf85e688bd7"

[vars]
MODEL = "@cf/google/gemma-4-26b-a4b-it"
NEURONS_PER_M_INPUT = "9091"
NEURONS_PER_M_CACHED = "9091"
NEURONS_PER_M_OUTPUT = "27273"
# Spending cap (user, 2026-10-14 20:15): $20 a month incl. the $5 Workers Paid base -> $15 of Workers AI overage.
DAILY_NEURON_BUDGET = "55000"
FREE_NEURONS_PER_DAY = "10000"
MONTHLY_BILLED_NEURON_CAP = "1363000"
USD_PER_1000_NEURONS = "0.011"
LIVE_BUDGET_SHARE = "0.5"
SESSION_TTL_S = "3600"
SESSION_SEGMENTS_PER_DAY = "1500"
IP_SEGMENTS_PER_DAY = "3000"
MAX_SEGMENTS_PER_REQUEST = "20"
MAX_SEGMENT_CHARS = "10000"
MAX_CLASSIFY_BYTES = "2097152"
MAX_TRANSLATE_BYTES = "1048576"
CLASSIFY_CHARS_PER_UNIT = "10000"
TURNSTILE_HOSTNAMES = "vitrans.pages.dev,*.vitrans.pages.dev"
